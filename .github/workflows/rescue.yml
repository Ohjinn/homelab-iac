name: Hunt Down Proxmox IP

# 수동으로 버튼을 눌러서 실행할 수 있도록 설정합니다.
on: [workflow_dispatch]

jobs:
  scan-network:
    runs-on: self-hosted
    steps:
      - name: 1. 러너의 현재 네트워크 망 확인
        run: |
          echo "=== 러너의 로컬 IP ==="
          ip -4 addr show
          echo "=== 기본 게이트웨이(공유기 IP) ==="
          ip route | grep default

      - name: 2. ARP 테이블(이웃 기기) 탐색
        run: |
          echo "=== 러너가 알고 있는 주변 기기 목록 ==="
          ip neigh

      - name: 3. 대역폭 전체 8006 포트(Proxmox) 융단 폭격 스캔
        run: |
          # 러너가 속한 공유기의 C클래스 대역(예: 192.168.0)을 자동으로 추출합니다.
          GATEWAY=$(ip route | grep default | awk '{print $3}')
          SUBNET=$(echo $GATEWAY | cut -d. -f1-3)
          
          echo "탐색 대역: $SUBNET.1 ~ $SUBNET.254"
          echo "응답하는 Proxmox 서버를 찾고 있습니다..."
          
          # 1부터 254까지 모든 IP의 8006 포트를 0.2초 단위로 두드려봅니다.
          for i in {1..254}; do
            timeout 0.2 bash -c "</dev/tcp/$SUBNET.$i/8006" 2>/dev/null && echo "✅ 빙고! Proxmox Web UI 발견: https://$SUBNET.$i:8006" &
          done
          wait
          echo "스캔 완료."